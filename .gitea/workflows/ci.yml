# .gitea/workflows/ci.yml — bare-CI（方案 3：裸环境只跑 import-free 测试子集）
#
# 策略（用户拍板 2026-08-23）：@deepseek-ai 只经 lib/core/shims.mjs 一个入口被
# index.mjs / dispatch-tool 依赖；裸 CI（装不到 @deepseek-ai）下：
#   - 只跑 import-free 模块的测试子集（test:bare）：pure / input-schema /
#     catalog-integrity（不加载 index.mjs，零依赖，无需 node_modules）。
#   - 依赖 junction 的测试（characterization / facade / gating / persist /
#     recycle / cost-guard / continuable-guard —— 动态 import index.mjs 或
#     shims.mjs）仅本机跑，见 test/README.md。
#   - 因此本项目不做整体 `pnpm install`（devDependencies 含 @deepseek-ai，
#     裸环境装不到）；eslint 在仓库外隔离安装后链接进仓库，行门照跑。
#
# 启用前提：Gitea 服务器须安装并注册 Act runner（标签含 ubuntu-latest，支持
# container 关键字）。当前为手动触发——runner 就绪后恢复文件内的 push 过滤，
# 并手动运行一次验证。详见 README「持续集成」一节。

name: CI

on:
  # 手动触发。推送自动触发暂缓：无 runner 时每次推送只会留下一个排队中的运行。
  # 恢复时取消下面注释——branches 过滤对已有分支的更新生效，新建分支的首推会绕过它。
  workflow_dispatch:
  # push:
  #   branches: [dev, main]
  # pull_request:
  #   branches: [dev, main]

jobs:
  bare-ci:
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node toolchain
        run: node --version && npm --version

      # bare 子集：零依赖，不要求 node_modules（npm run 只执行脚本本身）
      - name: Test (bare subset — import-free, no @deepseek-ai)
        run: npm run test:bare

      # 全仓库语法检查：node --check 只解析语法、不解析 import，裸环境安全
      - name: Syntax check (node --check)
        run: |
          for f in index.mjs lib/client.js lib/core/*.mjs scripts/*.mjs; do
            node --check "$f"
          done

      # 裸环境装不到 @deepseek-ai → 不在仓库内 install；在 /tmp 隔离安装
      # eslint + @eslint/js（唯一 lint 依赖），再软链为仓库 node_modules，
      # 使仓库根 eslint.config.js 的 `import @eslint/js` 可解析。
      # eslint 默认忽略 node_modules，不会把隔离目录纳入 lint 范围。
      - name: Install eslint in isolation (no @deepseek-ai)
        run: |
          mkdir -p /tmp/dsh-subagent-profile-eslint
          cd /tmp/dsh-subagent-profile-eslint
          npm init -y >/dev/null
          npm install --no-audit --no-fund eslint@^10.9.0 @eslint/js@^10.0.1
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/dsh-subagent-profile-eslint/node_modules node_modules

      - name: Lint (行门 eslint . --max-warnings 0)
        run: node node_modules/eslint/bin/eslint.js . --max-warnings 0

      # preflight：preset 树对账（临时 DSH_HOME）+ README 徽章 == version；零依赖
      - name: Preflight
        run: npm run preflight

      # 公开前敏感扫描：全历史私网地址/用户名/凭据模式（发布门禁，零依赖）
      - name: Leak scan (no private addresses / credentials in history)
        run: npm run leak-scan
